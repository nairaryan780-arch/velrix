services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velrix
      POSTGRES_PASSWORD: velrix
      POSTGRES_DB: velrix
    ports:
      - "5432:5432"
    volumes:
      - velrix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velrix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  velrix_pg:
